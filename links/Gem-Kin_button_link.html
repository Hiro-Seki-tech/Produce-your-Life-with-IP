<title>宝均 LINK HP対応ボタン</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #020617;
  color: #f8fafc;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Yu Gothic UI", "Meiryo", sans-serif;
}
.plip-wrap {
  position: relative;
  width: min(640px, calc(100vw - 32px));
  aspect-ratio: 1 / 1;
  user-select: none;
}
#plip-core-button {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  border: 2px solid #FFD700;
  border-radius: 18px;
  cursor: pointer;
  background: linear-gradient(135deg, #475569, #1e293b, #0f172a);
  box-shadow: 0 0 28px #FFD70055, 0 18px 45px rgba(0,0,0,.5);
  transition: border-color .2s, box-shadow .2s;
  touch-action: manipulation;
}
#plip-stage, #plip-stage > svg {
  display: block;
  width: 100%;
  height: 100%;
}
.plip-bubble {
  position: absolute;
  top: calc(100% - 5px);
  left: 0;
  width: 100%;
  z-index: 50;
  padding: 0 1px;
  pointer-events: none;
}
.plip-bubble svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
@keyframes plipNobleFloatSVG {
  0%, 100% { transform: translate3d(0,0,0) rotate(.001deg); }
  50% { transform: translate3d(0,2px,0) rotate(.001deg); }
}
@keyframes plipRainbowTextSVG {
  0% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
  14% { fill: #ff5500; }
  28% { fill: #ffcc00; }
  42% { fill: #00ff66; }
  56% { fill: #00ccff; }
  70% { fill: #3333ff; }
  84% { fill: #9900ff; }
  100% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
}
@keyframes plipBoltFlashSVG {
  0%, 100% { opacity: .85; filter: drop-shadow(0 0 1px #fde047); }
  50% { opacity: 1; filter: drop-shadow(0 0 5px #fde047); }
}
.animated-bubble-container-svg {
  animation: plipNobleFloatSVG 3s infinite ease-in-out;
  transform-box: fill-box;
  transform-origin: center;
}
.rainbow-bulb-svg { animation: plipRainbowTextSVG 7s linear infinite; }
.flashing-bolt-svg { animation: plipBoltFlashSVG 1.5s infinite ease-in-out; }
.effect-press { animation: effectPress .26s ease-out; }
.effect-pulse { animation: effectPulse .42s ease-out; }
.effect-glow { animation: effectGlow .55s ease-out; }
.effect-shake { animation: effectShake .42s ease-out; }
.effect-flash { animation: effectFlash .42s ease-out; }
@keyframes effectPress {
  0% { transform: scale(1) translateY(0); }
  45% { transform: scale(.94) translateY(8px); filter: brightness(1.25); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes effectPulse {
  0% { transform: scale(1); }
  42% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes effectGlow {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.8) saturate(1.35); }
  100% { filter: brightness(1); }
}
@keyframes effectShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px) rotate(-1deg); }
  40% { transform: translateX(9px) rotate(1deg); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
@keyframes effectFlash {
  0% { opacity: 1; }
  35% { opacity: .18; filter: brightness(2.5); }
  100% { opacity: 1; }
}
#plip-toast {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 1000;
  max-width: min(390px, calc(100vw - 36px));
  padding: 12px 15px;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #0f172a;
  color: #f8fafc;
  box-shadow: 0 14px 35px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
  transition: .25s;
  font-size: 14px;
}
#plip-toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* LINK HP 外部参照モード */
html, body {
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: transparent;
}
body {
  padding: 0;
}
.plip-wrap {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  aspect-ratio: 1 / 1;
}
.plip-bubble, #plip-toast {
  display: none !important;
}
</style>

n / Table (Top center flat octagon) -->\n                                        \u003cpolygon points=\"-12,-12 12,-12 18,-4 12,6 -12,6 -18,-4\" fill=\"#e0f7fa\" opacity=\"0.9\"/>\n                                        \u003c!-- 2. Side Kite Facets -->\n                                        \u003cpolygon points=\"0,-30 -12,-12 -18,-4 -26,-12\" fill=\"#b2ebf2\" opacity=\"0.6\" stroke=\"#ffffff\" stroke-width=\"1\"/>\n                                        \u003cpolygon points=\"0,-30 12,-12 18,-4 26,-12\" fill=\"#ffffff\" opacity=\"0.8\" stroke=\"#ffffff\" stroke-width=\"1\"/>\n                                        \u003c!-- 3. Bottom Pavilion Facets (Converging to bottom point) -->\n                                        \u003cpolygon points=\"-12,6 -16,22 0,26 0,6\" fill=\"#00838f\" opacity=\"0.75\" stroke=\"#ffffff\" stroke-width=\"0.8\"/>\n                                        \u003cpolygon points=\"12,6 16,22 0,26 0,6\" fill=\"#00acc1\" opacity=\"0.85\" stroke=\"#ffffff\" stroke-width=\"0.8\"/>\n                                        \u003c!-- 4. Top Triangle Stars -->\n                                        \u003cpolygon points=\"0,-30 -12,-12 12,-12\" fill=\"#ffffff\" opacity=\"0.95\" stroke=\"#ffffff\" stroke-width=\"1.2\"/>\n                                        \n                                        \u003c!-- Overlay clean cutlines -->\n                                        \u003cpolygon points=\"0,-30 26,-12 16,22 -16,22 -26,-12\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\"/>\n                                        \n                                        \u003c!-- Periodic Diamond Sparkle Cross-Star Flare (キラキラ) -->\n                                        \u003cpath class=\"gem-star-flash\" d=\"M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z\" fill=\"#ffffff\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 6. JAPANESE \"KOBAN\" COIN WITH \"KIREEN\" SHINE (Angle: 300deg - Traditional Oval Shape) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"300\" transform=\"translate(400, 400) rotate(300) translate(0, -275) rotate(-300)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"asset-scalable-group\" transform=\"scale(1.55)\">\n                                    \u003cg class=\"koban-sparkle\">\n                                        \u003c!-- Glowing backdrop -->\n                                        \u003cellipse cx=\"0\" cy=\"0\" rx=\"30\" ry=\"42\" fill=\"url(#gold-grad)\" opacity=\"0.15\" filter=\"url(#glow)\"/>\n                                        \n                                        \u003c!-- Traditional Oval Koban base -->\n                                        \u003cellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"36\" fill=\"url(#gold-grad)\" stroke=\"#664604\" stroke-width=\"2.5\"/>\n                                        \n                                        \u003c!-- Horizontal ridges/stripes (Gozame) -->\n                                        \u003cline x1=\"-15\" y1=\"-26\" x2=\"15\" y2=\"-26\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-18\" y1=\"-20\" x2=\"18\" y2=\"-20\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-21\" y1=\"-14\" x2=\"21\" y2=\"-14\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-22\" y1=\"-8\" x2=\"22\" y2=\"-8\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-23\" y1=\"-2\" x2=\"23\" y2=\"-2\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-23\" y1=\"4\" x2=\"23\" y2=\"4\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-22\" y1=\"10\" x2=\"22\" y2=\"10\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-21\" y1=\"16\" x2=\"21\" y2=\"16\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-18\" y1=\"22\" x2=\"18\" y2=\"22\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-15\" y1=\"28\" x2=\"15\" y2=\"28\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n\n                                        \u003c!-- Koban traditional stamps -->\n                                        \u003cpath d=\"M-6,-30 C-3,-31 3,-31 6,-30 C4,-33 -4,-33 -6,-30 Z\" fill=\"#664604\"/>\n                                        \u003ccircle cx=\"0\" cy=\"-29\" r=\"2\" fill=\"#664604\"/>\n                                        \u003cpath d=\"M-6,30 C-3,31 3,31 6,30 C4,33 -4,33 -6,30 Z\" fill=\"#664604\"/>\n                                        \u003ccircle cx=\"0\" cy=\"29\" r=\"2\" fill=\"#664604\"/>\n\n                                        \u003c!-- Center stamp box \"両\" -->\n                                        \u003crect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"#1b1202\" stroke=\"#664604\" stroke-width=\"1.2\"/>\n                                        \u003ctext x=\"0\" y=\"4\" font-family=\"'Noto Serif JP', serif\" font-size=\"10\" font-weight=\"900\" fill=\"url(#gold-grad)\" text-anchor=\"middle\">両\u003c/text>\n                                        \n                                        \u003c!-- Dynamic Golden \"Kireen\" Star Sparkle at different period -->\n                                        \u003cpath class=\"koban-star-flash\" d=\"M 15,-43 Q 15,-25 33,-25 Q 15,-25 15,-7 Q 15,-25 -3,-25 Q 15,-25 15,-43 Z\" fill=\"#ffd700\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                    \u003c/g>\n                \u003cstyle>\n                #orbit-system-group {\n                    transform-origin: 400px 400px;\n                    animation: global-orbit 80s linear infinite;\n                }\n                .counter-rotator {\n                    transform-origin: 0px 0px;\n                    animation: cancel-orbit 80s linear infinite;\n                }\n                @keyframes global-orbit {\n                    from { transform: rotate(0deg); }\n                    to { transform: rotate(360deg); }\n                }\n                @keyframes cancel-orbit {\n                    from { transform: rotate(0deg); }\n                    to { transform: rotate(-360deg); }\n                }\n\n                /* Active Emission Glow &amp; Swing Cycles */\n                .koban-sparkle {\n                    animation: koban-glow 4.5s ease-in-out infinite;\n                }\n                @keyframes koban-glow {\n                    0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(255,215,0,0.4)) brightness(0.95); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(255,215,0,0.95)) brightness(1.25); }\n                }\n                .koban-star-flash {\n                    transform-origin: 15px -25px;\n                    animation: koban-star 4.5s ease-in-out infinite;\n                }\n                @keyframes koban-star {\n                    0%, 75%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }\n                    85% { transform: scale(1.4) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 10px #fff); }\n                    92% { transform: scale(0) rotate(180deg); opacity: 0; }\n                }\n\n                .cash-breathe {\n                    transform-origin: 0px 0px;\n                    animation: cash-glow 5s ease-in-out infinite;\n                }\n                @keyframes cash-glow {\n                    0%, 100% { transform: scale(1); opacity: 0.85; filter: brightness(0.9); }\n                    50% { transform: scale(1.12); opacity: 1; filter: brightness(1.2) drop-shadow(0 0 18px rgba(76,175,80,0.7)); }\n                }\n\n                .key-swing {\n                    transform-origin: 0px -28px;\n                    animation: key-swing-action 6s ease-in-out infinite;\n                }\n                @keyframes key-swing-action {\n                    0%, 100% { transform: rotate(-15deg); filter: brightness(0.9) drop-shadow(0 0 3px rgba(255,255,255,0.2)); }\n                    50% { transform: rotate(15deg); filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,255,0.8)); }\n                }\n\n                .gem-shimmer {\n                    animation: gem-flash 3s ease-in-out infinite;\n                }\n                @keyframes gem-flash {\n                    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.3)); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.95)); }\n                }\n                .gem-star-flash {\n                    transform-origin: 0px -5px;\n                    animation: gem-star 3s ease-in-out infinite;\n                }\n                @keyframes gem-star {\n                    0%, 65%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }\n                    75% { transform: scale(1.6) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 12px #fff); }\n                    85% { transform: scale(0) rotate(90deg); opacity: 0; }\n                }\n\n                .kanji-pulse {\n                    animation: pulse-crest 3.5s ease-in-out infinite;\n                }\n                @keyframes pulse-crest {\n                    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.4)); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(255, 242, 163, 0.9)); }\n                }\n\n                .kanji-glow {\n                    animation: glow-crest 3.5s ease-in-out infinite;\n                }\n                @keyframes glow-crest {\n                    0%, 100% { opacity: 0.8; filter: saturate(0.9) drop-shadow(0 0 4px rgba(212, 175, 55, 0.4)); }\n                    50% { opacity: 1; filter: saturate(1.5) drop-shadow(0 0 20px rgba(212,175,55,1)); }\n                }\n            \u003c/style>\u003c/svg>","color":"#FFD700","musicMode":"ambient"},{"svg":"\u003csvg style=\"width:100%;height:100%;display:block\" preserveAspectRatio=\"xMidYMid meet\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns=\"http://www.w3.org/2000/svg\" id=\"symbol-svg\" viewBox=\"0 0 800 800\" >\n                    \u003cdefs>\n                        \u003c!-- Premium Metallic Gold Gradients -->\n                        \u003clinearGradient id=\"gold-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#fff4be\"/>\n                            \u003cstop offset=\"35%\" stop-color=\"#ffd700\"/>\n                            \u003cstop offset=\"70%\" stop-color=\"#ab820a\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#e2ba39\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Dynamic Background Glow (Controlled by theme JS) -->\n                        \u003cradialGradient id=\"bg-glow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                            \u003cstop id=\"glow-start\" offset=\"0%\" stop-color=\"#e2e8f0\" stop-opacity=\"0.25\"/>\n                            \u003cstop id=\"glow-mid\" offset=\"50%\" stop-color=\"#475569\" stop-opacity=\"0.05\"/>\n                            \u003cstop id=\"glow-end\" offset=\"100%\" stop-color=\"#0f172a\" stop-opacity=\"0\"/>\n                        \u003c/radialGradient>\n\n                        \u003c!-- High-Contrast Platinum Silver Gradient for Key -->\n                        \u003clinearGradient id=\"silver-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#ffffff\"/>\n                            \u003cstop offset=\"25%\" stop-color=\"#f1f5f9\"/>\n                            \u003cstop offset=\"65%\" stop-color=\"#94a3b8\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#334155\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Royal Gem Emerald & Diamond Gradients -->\n                        \u003clinearGradient id=\"gem-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#ffffff\"/>\n                            \u003cstop offset=\"20%\" stop-color=\"#e0f7fa\"/>\n                            \u003cstop offset=\"55%\" stop-color=\"#00e5ff\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#006064\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Standard Soft glow -->\n                        \u003cfilter id=\"glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\n                            \u003cfeGaussianBlur stdDeviation=\"6\" result=\"blur\"/>\n                            \u003cfeComposite in=\"SourceGraphic\" in2=\"blur\" operator=\"over\"/>\n                        \u003c/filter>\n                    \u003c/defs>\n\n                    \u003c!-- Background radial theme glow -->\n                    \u003crect id=\"svg-bg-rect\" width=\"800\" height=\"800\" fill=\"url(#bg-glow)\" style=\"transition: fill 0.8s; fill: rgb(15, 20, 29);\"/>\n\n                    \u003c!-- ========================================== -->\n                    \u003c!-- ORNATE THEME FRAME: Traditional Luxury    -->\n                    \u003c!-- ========================================== -->\n                    \u003cg id=\"ornate-frame\" stroke=\"#cbd5e1\" fill=\"none\" class=\"transition-all duration-500\">\n                \u003c!-- Outer double line classical frame -->\n                \u003crect x=\"25\" y=\"25\" width=\"750\" height=\"750\" stroke-width=\"4.5\" rx=\"10\"/>\n                \u003crect x=\"36\" y=\"36\" width=\"728\" height=\"728\" stroke-width=\"1.5\" opacity=\"0.8\" rx=\"8\"/>\n                \n                \u003c!-- Top-Left Corner Ornate Flourish -->\n                \u003cg transform=\"translate(25, 25)\">\n                    \u003cpath d=\"M 0,60 C 25,60 45,40 45,15 C 45,35 60,45 80,45\" stroke-width=\"2\"/>\n                    \u003cpath d=\"M 0,40 C 15,40 25,30 25,15\" stroke-width=\"1.5\" opacity=\"0.7\"/>\n                    \u003ccircle cx=\"45\" cy=\"45\" r=\"4\" fill=\"#cbd5e1\" stroke=\"none\" class=\"corner-dot\"/>\n                \u003c/g>\n                \u003c!-- Top-Right Corner Ornate Flourish -->\n                \u003cg transform=\"translate(775, 25) scale(-1, 1)\">\n                    \u003cpath d=\"M 0,60 C 25,60 45,40 45,15 C 45,35 60,45 80,45\" stroke-width=\"2\"/>\n                    \u003cpath d=\"M 0,40 C 15,40 25,30 25,15\" stroke-width=\"1.5\" opacity=\"0.7\"/>\n                    \u003ccircle cx=\"45\" cy=\"45\" r=\"4\" fill=\"#cbd5e1\" stroke=\"none\" class=\"corner-dot\"/>\n                \u003c/g>\n                \u003c!-- Bottom-Left Corner Ornate Flourish -->\n                \u003cg transform=\"translate(25, 775) scale(1, -1)\">\n                    \u003cpath d=\"M 0,60 C 25,60 45,40 45,15 C 45,35 60,45 80,45\" stroke-width=\"2\"/>\n                    \u003cpath d=\"M 0,40 C 15,40 25,30 25,15\" stroke-width=\"1.5\" opacity=\"0.7\"/>\n                    \u003ccircle cx=\"45\" cy=\"45\" r=\"4\" fill=\"#cbd5e1\" stroke=\"none\" class=\"corner-dot\"/>\n                \u003c/g>\n                \u003c!-- Bottom-Right Corner Ornate Flourish -->\n                \u003cg transform=\"translate(775, 775) scale(-1, -1)\">\n                    \u003cpath d=\"M 0,60 C 25,60 45,40 45,15 C 45,35 60,45 80,45\" stroke-width=\"2\"/>\n                    \u003cpath d=\"M 0,40 C 15,40 25,30 25,15\" stroke-width=\"1.5\" opacity=\"0.7\"/>\n                    \u003ccircle cx=\"45\" cy=\"45\" r=\"4\" fill=\"#cbd5e1\" stroke=\"none\" class=\"corner-dot\"/>\n                \u003c/g>\n            \u003c/g>\n\n                    \u003c!-- ========================================== -->\n                    \u003c!-- CENTRAL CORE: Symbol Gravity               -->\n                    \u003c!-- ========================================== -->\n                    \u003cg id=\"core-system-group\" transform=\"translate(400, 400)\">\n                        \u003c!-- Shadow Backplate -->\n                        \u003ccircle cx=\"0\" cy=\"0\" r=\"150\" fill=\"#000\" opacity=\"0.4\"/>\n                        \u003c!-- Core Outer Plate -->\n                        \u003ccircle cx=\"0\" cy=\"0\" r=\"130\" fill=\"url(#gold-grad)\" opacity=\"0.15\" filter=\"url(#glow)\"/>\n                        \u003c!-- The Central Button-like Circle -->\n                        \u003ccircle id=\"core-circle\" cx=\"0\" cy=\"0\" r=\"156\" fill=\"#150f03\" stroke=\"url(#gold-grad)\" stroke-width=\"6\" style=\"transition: fill 0.8s; fill: rgb(23, 30, 43); filter: drop-shadow(rgba(23, 30, 43, 0.5) 0px 0px 25px);\"/>\n                        \u003c!-- Inside details -->\n                        \u003ccircle cx=\"0\" cy=\"0\" r=\"125\" fill=\"none\" stroke=\"url(#gold-grad)\" stroke-width=\"1\" opacity=\"0.3\"/>\n                        \u003ccircle cx=\"0\" cy=\"0\" r=\"120\" fill=\"none\" stroke=\"url(#gold-grad)\" stroke-width=\"1.5\" opacity=\"0.5\"/>\n                        \n                        \u003c!-- \"宝均\" Integrated Center Brand Characters -->\n                        \u003ctext id=\"core-text\" x=\"0\" y=\"38\" font-family=\"'Noto Serif JP', serif\" font-weight=\"900\" font-size=\"122\" fill=\"url(#gold-grad)\" text-anchor=\"middle\" filter=\"url(#glow)\">宝均\u003c/text>\n                    \u003c/g>\n\n                    \u003c!-- ========================================== -->\n                    \u003c!-- ORBITAL SYSTEM: Smooth Symmetrical Orbit   -->\n                    \u003c!-- ========================================== -->\n                    \u003cg id=\"orbit-system-group\">\n\n                        \u003c!-- 1. \"宝\" HERITAGE CREST (Angle: 0deg - Symmetrical Top Axis, 1.5x Boosted) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"0\" transform=\"translate(400, 400) rotate(0) translate(0, -271) rotate(0)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"kanji-scalable-group\" transform=\"scale(1.9500000000000002)\">\n                                    \u003cg class=\"kanji-pulse\">\n                                        \u003c!-- Traditional octagonal crest frame -->\n                                        \u003cpolygon points=\"0,-33 23,-23 33,0 23,23 0,33 -23,23 -33,0 -23,-23\" fill=\"#150f03\" stroke=\"url(#gold-grad)\" stroke-width=\"2.5\"/>\n                                        \u003cpolygon points=\"0,-29 20,-20 29,0 20,20 0,29 -20,20 -29,0 -20,-20\" fill=\"none\" stroke=\"url(#gold-grad)\" stroke-width=\"0.8\" opacity=\"0.6\"/>\n                                        \u003c!-- Premium Japanese Kanji -->\n                                        \u003ctext x=\"0\" y=\"13\" font-family=\"'Noto Serif JP', serif\" font-weight=\"900\" font-size=\"36\" fill=\"url(#gold-grad)\" text-anchor=\"middle\" filter=\"url(#glow)\">宝\u003c/text>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 2. CASH / BANKNOTES (Angle: 60deg - Breathing Growth Asset) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"60\" transform=\"translate(400, 400) rotate(60) translate(0, -271) rotate(-60)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"asset-scalable-group\" transform=\"scale(1.3)\">\n                                    \u003cg class=\"cash-breathe\">\n                                        \u003crect x=\"-38\" y=\"-22\" width=\"76\" height=\"44\" rx=\"4\" fill=\"#144d1a\" stroke=\"url(#gold-grad)\" stroke-width=\"2.5\"/>\n                                        \u003crect x=\"-32\" y=\"-17\" width=\"64\" height=\"34\" rx=\"2\" fill=\"none\" stroke=\"#66bb6a\" stroke-width=\"1\" opacity=\"0.5\"/>\n                                        \u003c!-- Center crest on bill -->\n                                        \u003ccircle cx=\"0\" cy=\"0\" r=\"11\" fill=\"none\" stroke=\"#ffca28\" stroke-width=\"1.5\"/>\n                                        \u003ctext x=\"0\" y=\"4\" font-family=\"'Cinzel', sans-serif\" font-size=\"11\" fill=\"#ffd54f\" text-anchor=\"middle\" font-weight=\"900\">10k\u003c/text>\n                                        \u003c!-- Gold wrapping band -->\n                                        \u003crect x=\"-9\" y=\"-22\" width=\"18\" height=\"44\" fill=\"#e65100\" opacity=\"0.85\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 3. HEAVY SWING ANCIENT KEY (Angle: 120deg - Premium Redesigned Skeleton Key) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"120\" transform=\"translate(400, 400) rotate(120) translate(0, -271) rotate(-120)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"asset-scalable-group\" transform=\"scale(1.3)\">\n                                    \u003cg class=\"key-swing\">\n                                        \u003c!-- Ornate Clover-Heart Shaped Bow (Handle) -->\n                                        \u003cpath d=\"M 0,-32 C -12,-32 -20,-24 -20,-14 C -20,-6 -12,-2 0,-5 C 12,-2 20,-6 20,-14 C 20,-24 12,-32 0,-32 Z\" fill=\"none\" stroke=\"url(#silver-grad)\" stroke-width=\"3\"/>\n                                        \u003cpath d=\"M 0,-32 C -6,-44 -22,-40 -16,-26 C -20,-14 -6,-16 0,-16 C 6,-16 20,-14 16,-26 C 22,-40 6,-44 0,-32 Z\" fill=\"none\" stroke=\"url(#silver-grad)\" stroke-width=\"2\" opacity=\"0.8\"/>\n                                        \u003ccircle cx=\"0\" cy=\"-21\" r=\"5\" fill=\"none\" stroke=\"url(#silver-grad)\" stroke-width=\"2\"/>\n                                        \n                                        \u003c!-- Key Collar & Shaft -->\n                                        \u003crect x=\"-3.5\" y=\"-14\" width=\"7\" height=\"6\" fill=\"url(#silver-grad)\" rx=\"1.5\"/>\n                                        \u003cline x1=\"0\" y1=\"-8\" x2=\"0\" y2=\"34\" stroke=\"url(#silver-grad)\" stroke-width=\"4.5\" stroke-linecap=\"round\"/>\n                                        \n                                        \u003c!-- Detailed Ornate Shaft Ring -->\n                                        \u003crect x=\"-6\" y=\"10\" width=\"12\" height=\"3.5\" fill=\"url(#silver-grad)\" rx=\"1\"/>\n                                        \n                                        \u003c!-- Ornate Hollow Castle Bit (Lock Teeth with Keyhole Cutout) -->\n                                        \u003cpath d=\"M 0,18 L 16,18 L 16,23 L 6,23 L 6,27 L 16,27 L 16,33 L 0,33 Z\" fill=\"url(#silver-grad)\" stroke=\"url(#silver-grad)\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\n                                        \u003c!-- Hollow cut-out inside the bit -->\n                                        \u003crect id=\"key-hollow-rect\" x=\"5\" y=\"22\" width=\"6\" height=\"5\" fill=\"#111827\" class=\"transition-all duration-500\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 4. \"均\" BALANCE CREST (Angle: 180deg - Symmetrical Bottom Axis, 1.5x Boosted) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"180\" transform=\"translate(400, 400) rotate(180) translate(0, -271) rotate(-180)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"kanji-scalable-group\" transform=\"scale(1.9500000000000002)\">\n                                    \u003cg class=\"kanji-glow\">\n                                        \u003c!-- Traditional octagonal crest frame -->\n                                        \u003cpolygon points=\"0,-33 23,-23 33,0 23,23 0,33 -23,23 -33,0 -23,-23\" fill=\"#150f03\" stroke=\"url(#gold-grad)\" stroke-width=\"2.5\"/>\n                                        \u003cpolygon points=\"0,-29 20,-20 29,0 20,20 0,29 -20,20 -29,0 -20,-20\" fill=\"none\" stroke=\"url(#gold-grad)\" stroke-width=\"0.8\" opacity=\"0.6\"/>\n                                        \u003c!-- Premium Japanese Kanji -->\n                                        \u003ctext x=\"0\" y=\"13\" font-family=\"'Noto Serif JP', serif\" font-weight=\"900\" font-size=\"34\" fill=\"url(#gold-grad)\" text-anchor=\"middle\" filter=\"url(#glow)\">均\u003c/text>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 5. FACETED DIAMOND GEM (Angle: 240deg - Sparkling Cut-Glass Facets) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"240\" transform=\"translate(400, 400) rotate(240) translate(0, -271) rotate(-240)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"asset-scalable-group\" transform=\"scale(1.3)\">\n                                    \u003cg class=\"gem-shimmer\" transform=\"translate(0, -5)\">\n                                        \u003c!-- Background Glow -->\n                                        \u003cpolygon points=\"0,-30 26,-12 16,22 -16,22 -26,-12\" fill=\"url(#gem-grad)\" opacity=\"0.25\" filter=\"url(#glow)\"/>\n                                        \n                                        \u003c!-- Facet Group (Ornate Diamond Cut) -->\n                                        \u003c!-- 1. Crown / Table (Top center flat octagon) -->\n                                        \u003cpolygon points=\"-12,-12 12,-12 18,-4 12,6 -12,6 -18,-4\" fill=\"#e0f7fa\" opacity=\"0.9\"/>\n                                        \u003c!-- 2. Side Kite Facets -->\n                                        \u003cpolygon points=\"0,-30 -12,-12 -18,-4 -26,-12\" fill=\"#b2ebf2\" opacity=\"0.6\" stroke=\"#ffffff\" stroke-width=\"1\"/>\n                                        \u003cpolygon points=\"0,-30 12,-12 18,-4 26,-12\" fill=\"#ffffff\" opacity=\"0.8\" stroke=\"#ffffff\" stroke-width=\"1\"/>\n                                        \u003c!-- 3. Bottom Pavilion Facets (Converging to bottom point) -->\n                                        \u003cpolygon points=\"-12,6 -16,22 0,26 0,6\" fill=\"#00838f\" opacity=\"0.75\" stroke=\"#ffffff\" stroke-width=\"0.8\"/>\n                                        \u003cpolygon points=\"12,6 16,22 0,26 0,6\" fill=\"#00acc1\" opacity=\"0.85\" stroke=\"#ffffff\" stroke-width=\"0.8\"/>\n                                        \u003c!-- 4. Top Triangle Stars -->\n                                        \u003cpolygon points=\"0,-30 -12,-12 12,-12\" fill=\"#ffffff\" opacity=\"0.95\" stroke=\"#ffffff\" stroke-width=\"1.2\"/>\n                                        \n                                        \u003c!-- Overlay clean cutlines -->\n                                        \u003cpolygon points=\"0,-30 26,-12 16,22 -16,22 -26,-12\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\"/>\n                                        \n                                        \u003c!-- Periodic Diamond Sparkle Cross-Star Flare (キラキラ) -->\n                                        \u003cpath class=\"gem-star-flash\" d=\"M 0,-18 Q 0,0 18,0 Q 0,0 0,18 Q 0,0 -18,0 Q 0,0 0,-18 Z\" fill=\"#ffffff\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                        \u003c!-- 6. JAPANESE \"KOBAN\" COIN WITH \"KIREEN\" SHINE (Angle: 300deg - Traditional Oval Shape) -->\n                        \u003cg class=\"orbit-arm\" data-angle=\"300\" transform=\"translate(400, 400) rotate(300) translate(0, -271) rotate(-300)\">\n                            \u003cg class=\"counter-rotator\">\n                                \u003cg class=\"asset-scalable-group\" transform=\"scale(1.3)\">\n                                    \u003cg class=\"koban-sparkle\">\n                                        \u003c!-- Glowing backdrop -->\n                                        \u003cellipse cx=\"0\" cy=\"0\" rx=\"30\" ry=\"42\" fill=\"url(#gold-grad)\" opacity=\"0.15\" filter=\"url(#glow)\"/>\n                                        \n                                        \u003c!-- Traditional Oval Koban base -->\n                                        \u003cellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"36\" fill=\"url(#gold-grad)\" stroke=\"#664604\" stroke-width=\"2.5\"/>\n                                        \n                                        \u003c!-- Horizontal ridges/stripes (Gozame) -->\n                                        \u003cline x1=\"-15\" y1=\"-26\" x2=\"15\" y2=\"-26\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-18\" y1=\"-20\" x2=\"18\" y2=\"-20\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-21\" y1=\"-14\" x2=\"21\" y2=\"-14\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-22\" y1=\"-8\" x2=\"22\" y2=\"-8\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-23\" y1=\"-2\" x2=\"23\" y2=\"-2\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-23\" y1=\"4\" x2=\"23\" y2=\"4\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-22\" y1=\"10\" x2=\"22\" y2=\"10\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-21\" y1=\"16\" x2=\"21\" y2=\"16\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-18\" y1=\"22\" x2=\"18\" y2=\"22\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n                                        \u003cline x1=\"-15\" y1=\"28\" x2=\"15\" y2=\"28\" stroke=\"#664604\" stroke-width=\"1.2\" opacity=\"0.6\"/>\n\n                                        \u003c!-- Koban traditional stamps -->\n                                        \u003cpath d=\"M-6,-30 C-3,-31 3,-31 6,-30 C4,-33 -4,-33 -6,-30 Z\" fill=\"#664604\"/>\n                                        \u003ccircle cx=\"0\" cy=\"-29\" r=\"2\" fill=\"#664604\"/>\n                                        \u003cpath d=\"M-6,30 C-3,31 3,31 6,30 C4,33 -4,33 -6,30 Z\" fill=\"#664604\"/>\n                                        \u003ccircle cx=\"0\" cy=\"29\" r=\"2\" fill=\"#664604\"/>\n\n                                        \u003c!-- Center stamp box \"両\" -->\n                                        \u003crect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"#1b1202\" stroke=\"#664604\" stroke-width=\"1.2\"/>\n                                        \u003ctext x=\"0\" y=\"4\" font-family=\"'Noto Serif JP', serif\" font-size=\"10\" font-weight=\"900\" fill=\"url(#gold-grad)\" text-anchor=\"middle\">両\u003c/text>\n                                        \n                                        \u003c!-- Dynamic Golden \"Kireen\" Star Sparkle at different period -->\n                                        \u003cpath class=\"koban-star-flash\" d=\"M 15,-43 Q 15,-25 33,-25 Q 15,-25 15,-7 Q 15,-25 -3,-25 Q 15,-25 15,-43 Z\" fill=\"#ffd700\"/>\n                                    \u003c/g>\n                                \u003c/g>\n                            \u003c/g>\n                        \u003c/g>\n\n                    \u003c/g>\n                \u003cstyle>\n                #orbit-system-group {\n                    transform-origin: 400px 400px;\n                    animation: global-orbit 154s linear infinite;\n                }\n                .counter-rotator {\n                    transform-origin: 0px 0px;\n                    animation: cancel-orbit 154s linear infinite;\n                }\n                @keyframes global-orbit {\n                    from { transform: rotate(0deg); }\n                    to { transform: rotate(360deg); }\n                }\n                @keyframes cancel-orbit {\n                    from { transform: rotate(0deg); }\n                    to { transform: rotate(-360deg); }\n                }\n\n                /* Active Emission Glow &amp; Swing Cycles */\n                .koban-sparkle {\n                    animation: koban-glow 4.5s ease-in-out infinite;\n                }\n                @keyframes koban-glow {\n                    0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(255,215,0,0.4)) brightness(0.95); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(255,215,0,0.95)) brightness(1.25); }\n                }\n                .koban-star-flash {\n                    transform-origin: 15px -25px;\n                    animation: koban-star 4.5s ease-in-out infinite;\n                }\n                @keyframes koban-star {\n                    0%, 75%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }\n                    85% { transform: scale(1.4) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 10px #fff); }\n                    92% { transform: scale(0) rotate(180deg); opacity: 0; }\n                }\n\n                .cash-breathe {\n                    transform-origin: 0px 0px;\n                    animation: cash-glow 5s ease-in-out infinite;\n                }\n                @keyframes cash-glow {\n                    0%, 100% { transform: scale(1); opacity: 0.85; filter: brightness(0.9); }\n                    50% { transform: scale(1.12); opacity: 1; filter: brightness(1.2) drop-shadow(0 0 18px rgba(76,175,80,0.7)); }\n                }\n\n                .key-swing {\n                    transform-origin: 0px -28px;\n                    animation: key-swing-action 6s ease-in-out infinite;\n                }\n                @keyframes key-swing-action {\n                    0%, 100% { transform: rotate(-15deg); filter: brightness(0.9) drop-shadow(0 0 3px rgba(255,255,255,0.2)); }\n                    50% { transform: rotate(15deg); filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,255,0.8)); }\n                }\n\n                .gem-shimmer {\n                    animation: gem-flash 2.5s ease-in-out infinite;\n                }\n                @keyframes gem-flash {\n                    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px rgba(0, 229, 255, 0.3)); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.95)); }\n                }\n                .gem-star-flash {\n                    transform-origin: 0px -5px;\n                    animation: gem-star 2.5s ease-in-out infinite;\n                }\n                @keyframes gem-star {\n                    0%, 65%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }\n                    75% { transform: scale(1.6) rotate(45deg); opacity: 1; filter: drop-shadow(0 0 12px #fff); }\n                    85% { transform: scale(0) rotate(90deg); opacity: 0; }\n                }\n\n                .kanji-pulse {\n                    animation: pulse-crest 3.5s ease-in-out infinite;\n                }\n                @keyframes pulse-crest {\n                    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.4)); }\n                    50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(255, 242, 163, 0.9)); }\n                }\n\n                .kanji-glow {\n                    animation: glow-crest 3.5s ease-in-out infinite;\n                }\n                @keyframes glow-crest {\n                    0%, 100% { opacity: 0.8; filter: saturate(0.9) drop-shadow(0 0 4px rgba(212, 175, 55, 0.4)); }\n                    50% { opacity: 1; filter: saturate(1.5) drop-shadow(0 0 20px rgba(212,175,55,1)); }\n                }\n            \u003c/style>\u003c/svg>","color":"#E2E8F0","musicMode":"theme"},{"svg":"\u003csvg style=\"width:100%;height:100%;display:block\" preserveAspectRatio=\"xMidYMid meet\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" xmlns=\"http://www.w3.org/2000/svg\" id=\"symbol-svg\" viewBox=\"0 0 800 800\" >\n                    \u003cdefs>\n                        \u003c!-- Premium Metallic Gold Gradients -->\n                        \u003clinearGradient id=\"gold-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#fff4be\"/>\n                            \u003cstop offset=\"35%\" stop-color=\"#ffd700\"/>\n                            \u003cstop offset=\"70%\" stop-color=\"#ab820a\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#e2ba39\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Dynamic Background Glow (Controlled by theme JS) -->\n                        \u003cradialGradient id=\"bg-glow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n                            \u003cstop id=\"glow-start\" offset=\"0%\" stop-color=\"#a855f7\" stop-opacity=\"0.25\"/>\n                            \u003cstop id=\"glow-mid\" offset=\"50%\" stop-color=\"#581c87\" stop-opacity=\"0.05\"/>\n                            \u003cstop id=\"glow-end\" offset=\"100%\" stop-color=\"#0f051d\" stop-opacity=\"0\"/>\n                        \u003c/radialGradient>\n\n                        \u003c!-- High-Contrast Platinum Silver Gradient for Key -->\n                        \u003clinearGradient id=\"silver-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#ffffff\"/>\n                            \u003cstop offset=\"25%\" stop-color=\"#f1f5f9\"/>\n                            \u003cstop offset=\"65%\" stop-color=\"#94a3b8\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#334155\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Royal Gem Emerald & Diamond Gradients -->\n                        \u003clinearGradient id=\"gem-grad\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n                            \u003cstop offset=\"0%\" stop-color=\"#ffffff\"/>\n                            \u003cstop offset=\"20%\" stop-color=\"#e0f7fa\"/>\n                            \u003cstop offset=\"55%\" stop-color=\"#00e5ff\"/>\n                            \u003cstop offset=\"100%\" stop-color=\"#006064\"/>\n                        \u003c/linearGradient>\n\n                        \u003c!-- Standard Soft glow -->\n                        \u003cfilter id=\"glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\n                            \u003cfeGaussianBlur stdDeviation=\"6\" result=\"blur\"/>\n                            \u003cfeComposite in=\"SourceGraphic\" in2=\"blur\" o   function stopMediaInDocument(targetDocument) {
    try {
      targetDocument.querySelectorAll("audio, video").forEach(media => {
        try {
          media.pause();
          media.currentTime = 0;
        } catch (_) {}
      });

      targetDocument.querySelectorAll("[data-plip-managed-audio='true']")
        .forEach(element => element.remove());

      targetDocument.querySelectorAll("iframe").forEach(frame => {
        try {
          frame.contentWindow.postMessage({ type: "PLIP_STOP_AUDIO" }, "*");
        } catch (_) {}
      });
    } catch (_) {}
  }

  function stopManagedMusic() {
    musicSessionId += 1;

    if (themeLoopTimer) {
      clearTimeout(themeLoopTimer);
      themeLoopTimer = null;
    }

    if (managedAudio) {
      try { managedAudio.pause(); } catch (_) {}
      managedAudio.remove();
      managedAudio = null;

  function getAudioContext() {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return null;

    if (!sharedAudioContext || sharedAudioContext.state === "closed") {
      sharedAudioContext = new AudioContextClass();
    }
    return sharedAudioContext;
  }

  function tone(context, frequency, start, duration,
                type = "sine", volume = .1) {
    const oscillator = context.createOscillator();
    const gain = context.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);

    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + duration);
  }

    const time = context.currentTime;

    if (setting.sound === "click") {
      tone(context, 850, time, .035, "sine", .12);
    } else if (setting.sound === "digital") {
      tone(context, 620, time, .07, "square", .08);
      tone(context, 980, time + .07, .09, "square", .07);
    } else if (setting.sound === "confirm") {
      tone(context, 523.25, time, .10, "sine", .10);
      tone(context, 783.99, time + .09, .16, "sine", .10);
    } else if (setting.sound === "metallic") {
      tone(context, 1300, time, .07, "triangle", .07);
      tone(context, 1780, time + .018, .11, "triangle", .05);
    } else if (setting.sound === "impact") {
      tone(context, 120, time, .16, "sine", .18);
      tone(context, 65, time + .03, .22, "triangle", .09);
    } else if (setting.sound === "sparkle") {
      [880, 1174, 1568, 2093].forEach((frequency, index) => {
        tone(context, frequency, time + index * .055,
             .16, "sine", .06);
      });
    }
  }

  function runEffect() {
    if (EFFECT === "none") return;

    const className = "effect-" + EFFECT;
    button.classList.remove(className);
    void button.offsetWidth;
    button.classList.add(className);
    button.addEventListener("animationend", () => {
      button.classList.remove(className);
    }, { once: true });
  }

  function createManagedAudio(source, loop = false) {
    const audio = document.createElement("audio");
    audio.src = source;
    audio.loop = loop;
    audio.volume = .35;
    audio.preload = "auto";
    audio.dataset.plipManagedAudio = "true";
    audio.style.display = "none";
    document.body.appendChild(audio);
    managedAudio = audio;
    return audio;
  }

  function randomChoice(items) {
    return items[Math.floor(Math.random() * items.length)];
  }

  async function playSourceWithFallback(primarySource, fallbackSource, options = {}) {
    const sessionId = options.sessionId;
    const loop = Boolean(options.loop);
    const onEnded = options.onEnded;

    async function attempt(source, isFallback) {
      if (sessionId !== musicSessionId) return false;

      const audio = createManagedAudio(source, loop);

      if (typeof onEnded === "function") {
        audio.addEventListener("ended", () => {
          if (sessionId !== musicSessionId) return;
          onEnded();
        }, { once: true });
      }

      try {
        await audio.play();

        if (LINK_MODE && currentState === 1 && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "PLIP_TRACK_PLAYING",
            title: encodeURIComponent(linkCardTitle),
            trackUrl: audio.currentSrc || audio.src || source
          }, "*");
        }

        return true;
      } catch (_) {
        if (managedAudio === audio) {
          audio.remove();
          managedAudio = null;
        }

        if (!isFallback && primarySource !== fallbackSource) {
          return attempt(fallbackSource, true);
        }
        return false;
      }
    }

    return attempt(primarySource, false);
  }

  async function playMusicForState(state) {
    const sessionId = musicSessionId;

    if (state.musicMode === "silent") {
      showToast("🔇 音楽をオフにしました");
      return;
    }

    if (state.musicMode === "ambient") {
      const chosen = randomChoice([
        musicPath("bgm.mp3"),
        musicPath("bgm1.mp3")
      ]);

      const played = await playSourceWithFallback(
        chosen,
        musicPath("bgm.mp3"),
        { loop: true, sessionId }
      );

      if (sessionId !== musicSessionId) return;
      showToast(played
        ? "🌿 BGMを再生：" + chosen.split("/").pop()
        : "⚠️ BGMを再生できません");
      return;
    }

    const themeSources = [
      musicPath("song.mp3"),
      musicPath("song1.mp3"),
      musicPath("song2.mp3"),
      musicPath("song3.mp3"),
      musicPath("song4.mp3")
    ];

    const playNextTheme = async () => {
      if (sessionId !== musicSessionId || currentState !== 1) return;

      const chosen = randomChoice(themeSources);
      const played = await playSourceWithFallback(
        chosen,
        musicPath("song.mp3"),
        {
          loop: false,
          sessionId,
          onEnded: () => {
            if (sessionId !== musicSessionId || currentState !== 1) return;
            themeLoopTimer = setTimeout(() => {
              themeLoopTimer = null;
              playNextTheme();
            }, 3000);
          }
        }
      );

      if (sessionId !== musicSessionId || currentState !== 1) return;
      showToast(played
        ? "🎵 主題歌を再生：" + chosen.split("/").pop()
        : "⚠️ 主題歌を再生できません");
    };

    await playNextTheme();
  }

  async function applyState(withSound = true, transitionIndex = 0) {
    const state = STATES[currentState];

    stage.innerHTML = state.svg;
    button.style.borderColor = state.color;
    button.style.boxShadow =
      "0 0 28px " + state.color +
      "55, 0 18px 45px rgba(0,0,0,.5)";

    runEffect();

    if (withSound) {
      stopManagedMusic();
      playClickSound(TRANSITIONS[transitionIndex]);
      await playMusicForState(state);
    }
  }

  button.addEventListener("click", () => {
    const transitionIndex = currentState;
    currentState = (currentState + 1) % STATES.length;
    applyState(true, transitionIndex);

    if (LINK_MODE && window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "PLIP_BUTTON_CLICK",
        title: encodeURIComponent(linkCardTitle),
        stateValue: currentState
      }, "*");
    }
  });

  window.addEventListener("message", event => {
    if (event.data && event.data.type === "PLIP_STOP_AUDIO") {
      stopManagedMusic();
    }
  });

  applyState(false, 0);
})();
</script>
