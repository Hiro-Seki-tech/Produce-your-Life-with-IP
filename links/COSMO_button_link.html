<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLIP 3段階連動ボタン v5</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
  background: transparent;
  color: #f8fafc;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Yu Gothic UI", "Meiryo", sans-serif;
}
.plip-wrap {
  position: relative;
  width: min(100vw, 100vh);
  height: min(100vw, 100vh);
  aspect-ratio: 1 / 1;
  user-select: none;
}
#plip-core-button {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  overflow: hidden;
  border: 2px solid #FFD700;
  border-radius: 18px;
  cursor: pointer;
  background: linear-gradient(135deg, #475569, #1e293b, #0f172a);
  box-shadow: 0 0 28px #FFD70055, 0 18px 45px rgba(0,0,0,.5);
  transition: border-color .2s, box-shadow .2s;
  touch-action: manipulation;
}
#plip-stage, #plip-stage > svg {
  display: block;
  width: 100%;
  height: 100%;
}
.plip-bubble {
  display: none;
  position: absolute;
  top: calc(100% - 5px);
  left: 0;
  width: 100%;
  z-index: 50;
  padding: 0 1px;
  pointer-events: none;
}
.plip-bubble svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
@keyframes plipNobleFloatSVG {
  0%, 100% { transform: translate3d(0,0,0) rotate(.001deg); }
  50% { transform: translate3d(0,2px,0) rotate(.001deg); }
}
@keyframes plipRainbowTextSVG {
  0% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
  14% { fill: #ff5500; }
  28% { fill: #ffcc00; }
  42% { fill: #00ff66; }
  56% { fill: #00ccff; }
  70% { fill: #3333ff; }
  84% { fill: #9900ff; }
  100% { fill: #ff0055; filter: drop-shadow(0 0 3px rgba(255,0,85,.5)); }
}
@keyframes plipBoltFlashSVG {
  0%, 100% { opacity: .85; filter: drop-shadow(0 0 1px #fde047); }
  50% { opacity: 1; filter: drop-shadow(0 0 5px #fde047); }
}
.animated-bubble-container-svg {
  animation: plipNobleFloatSVG 3s infinite ease-in-out;
  transform-box: fill-box;
  transform-origin: center;
}
.rainbow-bulb-svg { animation: plipRainbowTextSVG 7s linear infinite; }
.flashing-bolt-svg { animation: plipBoltFlashSVG 1.5s infinite ease-in-out; }
.effect-press { animation: effectPress .26s ease-out; }
.effect-pulse { animation: effectPulse .42s ease-out; }
.effect-glow { animation: effectGlow .55s ease-out; }
.effect-shake { animation: effectShake .42s ease-out; }
.effect-flash { animation: effectFlash .42s ease-out; }
@keyframes effectPress {
  0% { transform: scale(1) translateY(0); }
  45% { transform: scale(.94) translateY(8px); filter: brightness(1.25); }
  100% { transform: scale(1) translateY(0); }
}
@keyframes effectPulse {
  0% { transform: scale(1); }
  42% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
@keyframes effectGlow {
  0% { filter: brightness(1); }
  45% { filter: brightness(1.8) saturate(1.35); }
  100% { filter: brightness(1); }
}
@keyframes effectShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px) rotate(-1deg); }
  40% { transform: translateX(9px) rotate(1deg); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}
@keyframes effectFlash {
  0% { opacity: 1; }
  35% { opacity: .18; filter: brightness(2.5); }
  100% { opacity: 1; }
}
#plip-toast {
  display: none;
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 1000;
  max-width: min(390px, calc(100vw - 36px));
  padding: 12px 15px;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #0f172a;
  color: #f8fafc;
  box-shadow: 0 14px 35px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateY(-16px);
  pointer-events: none;
  transition: .25s;
  font-size: 14px;
}
#plip-toast.show {
  opacity: 1;
  transform: translateY(0);
}
</style>
</head>

ath d=\"M -2,-6 L 4,-6 L 2,-13 L -4,-13 Z\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"0.5\" />\n                \u003cpath d=\"M 2,-13 L 8,-18 L 1,-15 L -6,-18 L -1,-13 Z\" fill=\"#f59e0b\" />\n                \u003cpolygon points=\"3,-6 5,-6 4,-4\" fill=\"#ef4444\" />\n                \u003ccircle cx=\"2\" cy=\"-9\" r=\"1.2\" fill=\"#22c55e\" filter=\"url(#neonGlow)\" />\n                \u003cpath d=\"M -2,4 L 6,4 L 8,8 L 2,8 Z\" fill=\"#f8fafc\" />\n                \u003crect x=\"4\" y=\"3\" width=\"12\" height=\"3\" rx=\"1\" fill=\"#475569\" />\n                \u003cline x1=\"16\" y1=\"4.5\" x2=\"26\" y2=\"4.5\" stroke=\"#38bdf8\" stroke-width=\"2\" filter=\"url(#neonGlow)\" />\n                \u003cpath d=\"M -2,-4 L 4,-4 L 6,-8 L 0,-8 Z\" fill=\"#f8fafc\" />\n                \u003cg transform=\"translate(1, -9) rotate(-15)\">\n                    \u003cpath d=\"M -6,-3 L 6,-3 L 4,8 L -4,8 Z\" fill=\"#ef4444\" stroke=\"#f8fafc\" stroke-width=\"1\" />\n                    \u003cpolygon points=\"0,-1 1,2 4,2 1,4 2,7 0,5 -2,7 -1,4 -4,2 -1,2\" fill=\"#eab308\" />\n                \u003c/g>\n            \n                \u003canimateMotion dur=\"26.18s\" repeatCount=\"indefinite\" rotate=\"auto\" begin=\"-31.42s\">\u003cmpath href=\"#pathC\"/>\u003c/animateMotion>\n                \u003canimate attributeName=\"visibility\" values=\"hidden;visible\" calcMode=\"discrete\" dur=\"26.18s\" repeatCount=\"indefinite\" begin=\"-31.42s\" />\n            \u003c/g>\n        \u003c/g>\n        \u003c!-- COSMO Rotating Logo (Front) -->\n        \u003cg transform=\"translate(250, 250) rotate(0.0)\">\n            \u003cg>\n                \u003c!-- USJ Style COSMO Logo (Ultra-Bold & 5x Larger, Brackets Removed) -->\n                \u003cg filter=\"url(#neonGlow)\">\n                    \u003c!-- Giant futuristic high-contrast text tags for extreme high legibility -->\n                    \u003ctext x=\"0\" y=\"24\" font-family=\"'Share Tech Mono', monospace, sans-serif\" font-size=\"75\" font-weight=\"900\" fill=\"#38bdf8\" stroke=\"#1e40af\" stroke-width=\"5\" paint-order=\"stroke fill\" text-anchor=\"middle\" letter-spacing=\"1\">COSMO\u003c/text>\n                \u003c/g>\n            \n                \u003canimateMotion dur=\"23.27s\" repeatCount=\"indefinite\">\u003cmpath href=\"#pathCosmo\"/>\u003c/animateMotion>\n                \u003canimate attributeName=\"visibility\" values=\"hidden;visible\" calcMode=\"discrete\" dur=\"23.27s\" repeatCount=\"indefinite\" />\n            \u003c/g>\n        \u003c/g>\n        \u003c!-- Rocket (Front) -->\n        \u003cg transform=\"translate(250, 250) rotate(20.0)\">\n            \u003cg>\n                \n                \u003cpolygon points=\"-24,0 -12,-6 -12,6\" fill=\"#f97316\" filter=\"url(#neonGlow)\">\n                    \u003canimate attributeName=\"points\" values=\"-24,0 -12,-6 -12,6; -28,0 -12,-5 -12,5; -24,0 -12,-6 -12,6\" dur=\"0.15s\" repeatCount=\"indefinite\"/>\n                \u003c/polygon>\n                \u003cpath d=\"M 14,0 L -12,-8 L -12,8 Z\" fill=\"#f1f5f9\" stroke=\"#94a3b8\" stroke-width=\"1.5\" />\n                \u003cpath d=\"M -12,-8 L -18,-14 L -8,-8 Z\" fill=\"#ef4444\" />\n                \u003cpath d=\"M -12,8 L -18,14 L -8,8 Z\" fill=\"#ef4444\" />\n                \u003ccircle cx=\"4\" cy=\"0\" r=\"3\" fill=\"#38bdf8\" stroke=\"#1e3a8a\" stroke-width=\"0.5\" />\n            \n                \u003canimateMotion dur=\"10.47s\" repeatCount=\"indefinite\" rotate=\"auto\" begin=\"-7.33s\">\u003cmpath href=\"#pathRock\"/>\u003c/animateMotion>\n                \u003canimate attributeName=\"visibility\" values=\"hidden;visible\" calcMode=\"discrete\" dur=\"10.47s\" repeatCount=\"indefinite\" begin=\"-7.33s\" />\n            \u003c/g>\n        \u003c/g>\n    \u003c/g>\n\u003c/svg>","color":"#0D0D0D","musicMode":"silent"}];
  const TRANSITIONS = [{"sound":"speech","speech":{"text":"主題歌オン","rate":1.9,"pitch":1.9,"volume":1}},{"sound":"speech","speech":{"text":"サウンドオフ","rate":1.6,"pitch":1.7,"volume":1}},{"sound":"speech","speech":{"text":"コスモ","rate":1.9,"pitch":1.8,"volume":1}}];
  const EFFECT = "pulse";
  const LINK_MODE = true;
  const queryParams = new URLSearchParams(window.location.search);
  const linkCardTitle = queryParams.get("title") || "COSMO";
  const requestedMusicBase = queryParams.get("musicBase") || "./music/";

  function musicPath(filename) {
    const base = requestedMusicBase.endsWith("/")
      ? requestedMusicBase
      : requestedMusicBase + "/";
    return base + filename;
  }

  let currentState = 0;
  let managedAudio = null;
  let toastTimer = null;
  let sharedAudioContext = null;
  let themeLoopTimer = null;
  let musicSessionId = 0;

  const button = document.getElementById("plip-core-button");
  const stage = document.getElementById("plip-stage");
  const toast = document.getElementById("plip-toast");

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
  }

  function stopMediaInDocument(targetDocument) {
    try {
      targetDocument.querySelectorAll("audio, video").forEach(media => {
        try {
          media.pause();
          media.currentTime = 0;
        } catch (_) {}
      });

      targetDocument.querySelectorAll("[data-plip-managed-audio='true']")
        .forEach(element => element.remove());

      targetDocument.querySelectorAll("iframe").forEach(frame => {
        try {
          frame.contentWindow.postMessage({ type: "PLIP_STOP_AUDIO" }, "*");
        } catch (_) {}
      });
    } catch (_) {}
  }

  function stopManagedMusic() {
    musicSessionId += 1;

    if (themeLoopTimer) {
      clearTimeout(themeLoopTimer);
      themeLoopTimer = null;
    }

    if (managedAudio) {
      try { managedAudio.pause(); } catch (_) {}
      managedAudio.remove();
      managedAudio = null;
    }

    stopMediaInDocument(document);

    // LINK HP側の兄弟ボタン停止は、親ページのpostMessage制御に任せる。
  }

  function getAudioContext() {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return null;

    if (!sharedAudioContext || sharedAudioContext.state === "closed") {
      sharedAudioContext = new AudioContextClass();
    }
    return sharedAudioContext;
  }

  function tone(context, frequency, start, duration,
                type = "sine", volume = .1) {
    const oscillator = context.createOscillator();
    const gain = context.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(volume, start);
    gain.gain.exponentialRampToValueAtTime(.0001, start + duration);

    oscillator.connect(gain).connect(context.destination);
    oscillator.start(start);
    oscillator.stop(start + duration);
  }

  function playClickSound(setting) {
    if (setting.sound === "none") return;

    if (setting.sound === "speech") {
      if (!("speechSynthesis" in window)) return;

      const utterance = new SpeechSynthesisUtterance(setting.speech.text);
      utterance.lang = "ja-JP";
      utterance.rate = setting.speech.rate;
      utterance.pitch = setting.speech.pitch;
      utterance.volume = setting.speech.volume;
      speechSynthesis.speak(utterance);
      return;
    }

    const context = getAudioContext();
    if (!context) return;

    if (context.state === "suspended") {
      context.resume();
    }

    const time = context.currentTime;

    if (setting.sound === "click") {
      tone(context, 850, time, .035, "sine", .12);
    } else if (setting.sound === "digital") {
      tone(context, 620, time, .07, "square", .08);
      tone(context, 980, time + .07, .09, "square", .07);
    } else if (setting.sound === "confirm") {
      tone(context, 523.25, time, .10, "sine", .10);
      tone(context, 783.99, time + .09, .16, "sine", .10);
    } else if (setting.sound === "metallic") {
      tone(context, 1300, time, .07, "triangle", .07);
      tone(context, 1780, time + .018, .11, "triangle", .05);
    } else if (setting.sound === "impact") {
      tone(context, 120, time, .16, "sine", .18);
      tone(context, 65, time + .03, .22, "triangle", .09);
    } else if (setting.sound === "sparkle") {
      [880, 1174, 1568, 2093].forEach((frequency, index) => {
        tone(context, frequency, time + index * .055,
             .16, "sine", .06);
      });
    }
  }

  function runEffect() {
    if (EFFECT === "none") return;

    const className = "effect-" + EFFECT;
    button.classList.remove(className);
    void button.offsetWidth;
    button.classList.add(className);
    button.addEventListener("animationend", () => {
      button.classList.remove(className);
    }, { once: true });
  }

  function createManagedAudio(source, loop = false) {
    const audio = document.createElement("audio");
    audio.src = source;
    audio.loop = loop;
    audio.volume = .35;
    audio.preload = "auto";
    audio.dataset.plipManagedAudio = "true";
    audio.style.display = "none";
    document.body.appendChild(audio);
    managedAudio = audio;
    return audio;
  }

  function randomChoice(items) {
    return items[Math.floor(Math.random() * items.length)];
  }

  async function playSourceWithFallback(primarySource, fallbackSource, options = {}) {
    const sessionId = options.sessionId;
    const loop = Boolean(options.loop);
    const onEnded = options.onEnded;

    async function attempt(source, isFallback) {
      if (sessionId !== musicSessionId) return false;

      const audio = createManagedAudio(source, loop);

      if (typeof onEnded === "function") {
        audio.addEventListener("ended", () => {
          if (sessionId !== musicSessionId) return;
          onEnded();
        }, { once: true });
      }

      try {
        await audio.play();

        if (LINK_MODE && currentState === 1 && window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "PLIP_TRACK_PLAYING",
            title: encodeURIComponent(linkCardTitle),
            trackUrl: audio.currentSrc || audio.src || source
          }, "*");
        }

        return true;
      } catch (_) {
        if (managedAudio === audio) {
          audio.remove();
          managedAudio = null;
        }

        if (!isFallback && primarySource !== fallbackSource) {
          return attempt(fallbackSource, true);
        }
        return false;
      }
    }

    return attempt(primarySource, false);
  }

  async function playMusicForState(state) {
    const sessionId = musicSessionId;

    if (state.musicMode === "silent") {
      showToast("🔇 音楽をオフにしました");
      return;
    }

    if (state.musicMode === "ambient") {
      const chosen = randomChoice([
        musicPath("bgm.mp3"),
        musicPath("bgm1.mp3")
      ]);

      const played = await playSourceWithFallback(
        chosen,
        musicPath("bgm.mp3"),
        { loop: true, sessionId }
      );

      if (sessionId !== musicSessionId) return;
      showToast(played
        ? "🌿 BGMを再生：" + chosen.split("/").pop()
        : "⚠️ BGMを再生できません");
      return;
    }

    const themeSources = [
      musicPath("song.mp3"),
      musicPath("song1.mp3"),
      musicPath("song2.mp3"),
      musicPath("song3.mp3"),
      musicPath("song4.mp3")
    ];

    const playNextTheme = async () => {
      if (sessionId !== musicSessionId || currentState !== 1) return;

      const chosen = randomChoice(themeSources);
      const played = await playSourceWithFallback(
        chosen,
        musicPath("song.mp3"),
        {
          loop: false,
          sessionId,
          onEnded: () => {
            if (sessionId !== musicSessionId || currentState !== 1) return;
            themeLoopTimer = setTimeout(() => {
              themeLoopTimer = null;
              playNextTheme();
            }, 3000);
          }
        }
      );

      if (sessionId !== musicSessionId || currentState !== 1) return;
      showToast(played
        ? "🎵 主題歌を再生：" + chosen.split("/").pop()
        : "⚠️ 主題歌を再生できません");
    };

    await playNextTheme();
  }

  async function applyState(withSound = true, transitionIndex = 0) {
    const state = STATES[currentState];

    stage.innerHTML = state.svg;
    button.style.borderColor = state.color;
    button.style.boxShadow =
      "0 0 28px " + state.color +
      "55, 0 18px 45px rgba(0,0,0,.5)";

    runEffect();

    if (withSound) {
      stopManagedMusic();
      playClickSound(TRANSITIONS[transitionIndex]);
      await playMusicForState(state);
    }
  }

  button.addEventListener("click", () => {
    const transitionIndex = currentState;
    currentState = (currentState + 1) % STATES.length;
    applyState(true, transitionIndex);

    if (LINK_MODE && window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "PLIP_BUTTON_CLICK",
        title: encodeURIComponent(linkCardTitle),
        stateValue: currentState
      }, "*");
    }
  });

  window.addEventListener("message", event => {
    if (event.data && event.data.type === "PLIP_STOP_AUDIO") {
      stopManagedMusic();
    }
  });

  applyState(false, 0);
})();
</script>
